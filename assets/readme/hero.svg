<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="440" viewBox="0 0 1200 440" role="img" aria-labelledby="title desc">
  <title id="title">Gas City Cookbook</title>
  <desc id="desc">One config, any model provider. Agents ask for a tier (fast-worker, solid-worker, deep-thinker) and each city binds it to a model: Haiku, Sonnet, Opus in claude-city; Gemini Flash Low, Pro Low, Pro High in gemini-city.</desc>
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#000000" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>
  <rect width="1200" height="440" rx="4" fill="#f8fafc"/>
  <rect width="1200" height="440" rx="4" fill="url(#grid)"/>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="4" fill="none" stroke="#e2e8f0"/>
  <text x="64" y="92" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="500" fill="#e85d26" letter-spacing="3.6">GAS CITY // MULTI-PROVIDER CONFIG</text>
  <text x="60" y="186" font-family="'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif" font-size="84" font-weight="700" fill="#0f172a" letter-spacing="-4">Gas City</text>
  <text x="60" y="268" font-family="'Source Serif 4','Source Serif Pro',Georgia,'Times New Roman',serif" font-size="84" font-weight="700" fill="#0f172a" letter-spacing="-4">Cookbook</text>
  <text x="64" y="322" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#475569">One config, any model provider. Agents ask</text>
  <text x="64" y="352" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="22" font-weight="400" fill="#475569">for a tier; each city binds it to a model.</text>
  <text x="64" y="400" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="18" font-weight="400" fill="#64748b">3 recipes · 1 pack · 2 example cities · MIT</text>
  <rect x="600" y="64" width="536" height="312" rx="4" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="632" y="114" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="500" fill="#64748b" letter-spacing="1.6">TIER</text>
  <text x="832" y="114" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="500" fill="#64748b" letter-spacing="1.6">CLAUDE-CITY</text>
  <text x="988" y="114" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="500" fill="#64748b" letter-spacing="1.6">GEMINI-CITY</text>
  <circle cx="637" cy="165" r="5" fill="#54C8CE"/>
  <text x="656" y="172" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="600" fill="#0f172a">fast-worker</text>
  <text x="832" y="172" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a">Haiku</text>
  <text x="988" y="172" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a">Flash (Low)</text>
  <circle cx="637" cy="223" r="5" fill="#e85d26"/>
  <text x="656" y="230" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="600" fill="#0f172a">solid-worker</text>
  <text x="832" y="230" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a">Sonnet</text>
  <text x="988" y="230" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a">Pro (Low)</text>
  <circle cx="637" cy="281" r="5" fill="#EB5570"/>
  <text x="656" y="288" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="20" font-weight="600" fill="#0f172a">deep-thinker</text>
  <text x="832" y="288" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a">Opus</text>
  <text x="988" y="288" font-family="Inter,-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif" font-size="21" font-weight="400" fill="#0f172a">Pro (High)</text>
  <text x="632" y="346" font-family="'JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="400" fill="#64748b"># same pack, mayor, routing, formulas</text>
</svg>
